name: Build Bolinho Tracker APK
on:
  push:
    branches: [ chatgpt-bolinho-tracker-build ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BolinhoTracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Inject v2 source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          payload = Path('v2_main.gz.b64').read_text().strip()
          src = gzip.decompress(base64.b64decode(payload))
          out = Path('app/src/main/java/com/bolinho/tracker/MainActivity.java')
          out.write_bytes(src)
          print('Injected', len(src), 'bytes into', out)
          PY
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BolinhoTracker-v2-debug
          path: BolinhoTracker/app/build/outputs/apk/debug/app-debug.apk
